# Builds the job-application portfolio from the main site repo and publishes it to GitHub Pages.
# The main site already turns the Google Sheet into files; this just reads those files,
# so editing the sheet updates both sites. No secrets needed (the main repo is public).
name: Build portfolio

on:
  schedule:
    - cron: '25 * * * *'        # hourly, after the main site's sheet sync (:07 and :37)
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [main-site-updated]  # optional instant trigger from the main repo (see README)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get the latest content from the main site
        run: bash tools/pull-content.sh
      - name: Build
        run: node tools/build.js
      - name: Cache the PDF browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1
      - name: Make the one-page PDF
        run: |
          npm install -g playwright@1.56.1
          npx -y playwright@1.56.1 install --with-deps chromium
          node tools/build-pdf.js || echo "::warning::The one-page PDF could not be made this time; the site is published without its download button."
      - name: Hide the PDF button if the PDF wasn't made
        run: |
          [ -f site/edison-ochieng-one-page-portfolio.pdf ] || node -e "
            const f = 'site/index.html', fs = require('fs');
            fs.writeFileSync(f, fs.readFileSync(f, 'utf8').replace(/<a [^>]*href=\"edison-ochieng-one-page-portfolio\.pdf\"[^>]*>[^<]*<\/a>/, ''));"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
